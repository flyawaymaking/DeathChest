plugins {
    id 'java'
}

group = 'com.flyaway.deathchest'
version = '1.5.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
      name = "jitpack"
      url = "https://jitpack.io/"
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.159-beta'
    compileOnly 'com.github.decentsoftware-eu:decentholograms:2.10.1'
}

tasks.jar {
    archiveBaseName.set("DeathChest")
}

tasks.processResources {
    filesMatching("plugin.yml") {
        expand(
                version: project.version,
                name: project.name,
                group: project.group
        )
    }
}
